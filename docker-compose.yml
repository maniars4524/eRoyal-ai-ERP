services:
  postgres:
    image: postgres:16-alpine
    container_name: esway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-esway}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-esway}
      POSTGRES_DB: ${DB_NAME:-esway_erp}
    ports:
      - "5432:5432"
    volumes:
      - esway-postgres-data:/var/lib/postgresql/data

volumes:
  esway-postgres-data:
