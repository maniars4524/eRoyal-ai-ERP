# Render Blueprint for eSway ERP 2.0: one web service + one managed PostgreSQL database.
databases:
  - name: esway-erp-db
    databaseName: esway_erp
    plan: free
services:
  - type: web
    name: eswayerp-2-0
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: esway-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_USERNAME
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
